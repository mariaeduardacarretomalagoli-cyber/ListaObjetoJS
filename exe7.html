    <script>
        var urna = {
            avaliacao: "",
            nota: [],

            registrarVoto() {
                var avaliacao = prompt("Digite a avaliação do atendimento (1-5): ")
                this.nota.push(avaliacao)
                if (avaliacao == 1 && avaliacao <= 3) {
                    this.contadorNegativo = this.contadorNegativo + 1
                }
                else if (avaliacao == 4 || avaliacao == 5) {
                    this.contadorPositivo = this.contadorPositivo + 1
                }
                else {
                    alert("Avaliação inválida. Por favor, digite um número entre 1 e 5.")
                }
            },

            verificacaoPorcentagem() {
                var totalVotos = this.nota.length;  

                this.porcentagemNegativo = (this.contadorNegativo / totalVotos) * 100;
                this.porcentagemPositivo = (this.contadorPositivo / totalVotos) * 100;

                alert("Porcentagem Negativa: " + this.porcentagemNegativo + "%");
                alert("Porcentagem Positiva: " + this.porcentagemPositivo + "%");
            },

            }

    </script>
