<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var jogo = {
            numerosecreto: 0,
            maximoTentativas: 5,
            tentativas: 0,
            numerosDigitados: [],
            situacao: 'jogando',

            sortear() {
                this.numerosecreto = Math.floor(Math.random() * 100) + 1
                alert('Número sorteado!')
            },

            receberTentativa() {
                var numero = Number(prompt('Digite um numero entre 1 e 100'))

                if (this.numerosDigitados.includes(numero)) {
                    alert('Você já digitou esse número')
                    return
                }

                this.numerosDigitados.push(numero)
                this.tentativas = this.tentativas + 1

                if (numero == this.numerosecreto) {
                    alert('Voce acertou!')
                    this.situacao = 'venceu'
                }

                else if (numero < this.numerosecreto) {
                    alert('O numero secreto é maior')
                }

                else {
                    alert('O numero secreto é menor')
                }

                if (this.tentativas == this.maximoTentativas && this.situacao != 'venceu') {
                    alert('Perdeu! O numero secreto era: ' + this.numerosecreto)
                    this.situacao = 'perdeu'
                }
            },

            reiniciar() {
                this.numerosecreto = 0
                this.tentativas = 0
                this.numerosDigitados = []
                this.situacao = 'jogando'

                alert('O jogo foi reiniciado')
            }
        }


        jogo.sortear()

        jogo.receberTentativa()
        jogo.receberTentativa()
        jogo.receberTentativa()
        jogo.receberTentativa()
        jogo.receberTentativa()
        jogo.reiniciar()
    </script>
